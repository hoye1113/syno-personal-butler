# Chat / proactive composition for Syno over dsh-jsonrpc-agent.
# stdout is JSON-RPC only. Credentials stay in the child environment, never here.
# Plugin names are resolved from the Harness clone (spawn cwd / packaged-bin);
# the relative syno-tool-bridge plugin stays config-relative.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000
      - id: deepseek-chat
        contextWindow: 128000

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

# Host sets DSH_CWD to an isolated profile workspace under local data
# (%LOCALAPPDATA%\Syno\harness\workspace\<profile>), never the git repo.
# vault / apps / ops writes still go through syno_* + Policy / GitGuard.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# never is safe only because the sandbox root is the isolated workspace.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: pty
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 300000

- id: terminal-pwsh
  name: '@deepseek-ai/dsh-terminal-bash'
  disabled: !!js process.platform !== 'win32'
  config:
    shellDialect: pwsh
    timeoutMs: 300000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'
    workspaceContext: false
    skills:
      enabled: true
      filesystem:
        includeDefaultRoots: false
        watch: false
        customSkillDirs:
          - !!js process.env.SYNO_SKILL_ROOT
    toolBash: false
    toolJobs: false
    goals: false

- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 300000

- id: persistent-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh-persistent'
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 300000

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

# Official WebSearchProvider. Reuses DEEPSEEK_API_KEY via the Anthropic-compat
# Messages endpoint (not DEEPSEEK_BASE_URL). Community hub plugins are not
# mounted here: the sidecar resolves packages from SYNO_DSH_ROOT.
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    searchTimeoutMs: 60000

- id: syno-tool-bridge
  name: ./syno-tool-bridge-plugin.mjs

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
