# DSH sdk overlay for the JSON-RPC chat fallback.
# Production chat uses the separate loopback Web profile and Syno agent preset.
# This overlay keeps the same Kimi Code model route (pi-ai twin), isolated
# workspace, and core Syno tools for an explicitly selected JSON-RPC surface.

- id: system-prompt
  config:
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'
    personaSuffix: Your working directory is {{cwd}}.

- id: llm-pi-ai
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_API_KEY
        reasoning: high
        modelOverrides:
          kimi-for-coding:
            reasoningEfforts:
              low: low
              high: high
              max: max
        requestImagePixelBudget: 1048576
        requestImageMaxBytes: 786432
        maxRequestImageBytes: 1400000

# web_search 由此链提供，与生产 web profile 同一接缝（未配置 key 的 provider 自动跳过）。
- id: web
  config:
    searchProvider: syno-search
    fetchProvider: http

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    # The RPC fallback has no human approval UI; the supervisor confines this
    # writable profile to the isolated DSH_CWD workspace above.
    policy: never

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- insert:
    - id: syno-web-search
      name: ../../packages/syno-dsh-plugin/plugins/web-search/index.mjs
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
    - id: syno-tool-bridge
      name: ./syno-tool-bridge-plugin.mjs
      config:
        toolSet: core
        allowWhenPluginMode: true
