# DSH sdk overlay for the JSON-RPC chat fallback.
# Production chat uses the separate loopback Web profile and Syno agent preset.
# This overlay keeps the same model route, isolated workspace, and core Syno
# tools for an explicitly selected JSON-RPC surface.

- id: system-prompt
  config:
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'
    personaSuffix: Your working directory is {{cwd}}.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-v4-flash-vision-exp
        inputModalities:
          - text
          - image
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- insert:
    - id: syno-tool-bridge
      name: ./syno-tool-bridge-plugin.mjs
      config:
        toolSet: core
