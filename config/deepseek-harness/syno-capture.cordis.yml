# DSH sdk-minimal overlay for capture and ingest analysis.
# sdk-minimal supplies the JSON-RPC server and agent runtime; this profile only
# adds Syno Bridge tools. Shell tools stay disabled, and no filesystem or web
# tool is added. Credentials stay in the child environment, never here.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: disabled
    models:
      - id: deepseek-v4-flash-vision-exp
        inputModalities:
          - text
          - image
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: terminal-bash
  disabled: true

- id: terminal-pwsh
  disabled: true

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: sessions
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- insert:
    - id: syno-tool-bridge
      name: ./syno-tool-bridge-plugin.mjs
      config:
        toolSet: all
