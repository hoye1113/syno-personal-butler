# Syno production overlay over the current DSH base/web bundles.
# dsh-base owns the official compaction backend; schedule is an official
# function plugin and is mounted here because it is not a profile bundle.
# Route the LLM seam to Kimi Code through the pi-ai twin, serve web_search from
# the Syno search chain (doubao → tavily → exa, keys in the child env), mount
# the Host Tool Bridge, and keep the sandbox on DSH_CWD.
# Do not add dsh-plugin.org marketplace packages here.

- insert:
    - id: preset-syno
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: syno
        name: Syno production
        description: Syno domain agent with the controlled production tool surface.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              watch: false
              customSkillDirs:
                - !!js process.env.SYNO_SKILL_ROOT ?? process.cwd()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              search: true
              searchTimeoutMs: 60000

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: syno-tool-bridge
      name: '@syno/dsh-plugin'
      config:
        toolSet: core
    # B5 双轨：in-process capabilities 与微信通道骨架（全部门控默认关闭，
    # 不设 env 时既不注册工具也不建通道；`SYNO_CHAT_TOOLS=plugin` 时 bridge 静默）。
    - id: syno-capabilities
      name: './plugins/capabilities/index.mjs'
    - id: syno-channel-weixin
      name: './plugins/channel-weixin/index.mjs'
    # Syno 组合搜索 provider（豆包 → Tavily → Exa，按查询语言路由）。
    - id: syno-web-search
      name: './plugins/web-search/index.mjs'
    # 运行时时间上下文：模型拿不到当前日期时会把「今天」猜成旧日期（2026-10-12 实测）。
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

# web_search 由此链提供；未配置 key 的 provider 自动跳过。
- id: web
  config:
    searchProvider: syno-search
    fetchProvider: http

# Kimi Code route through the pi-ai twin's installed catalog provider. Image
# budgets stay under Kimi's ~2 MB per-request cap with text headroom.
# 0.1.7 生产根的 kimi-for-coding 目录条目缺 thinkingLevelMap，未声明档位时
# 请求不启用 thinking，模型会把过程叙述写进正文（2026-10-12 实测）；
# modelOverrides 补齐档位后 route 级 reasoning: high 才会真正下发 thinking。
- id: llm-pi-ai
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_API_KEY
        reasoning: high
        modelOverrides:
          kimi-for-coding:
            reasoningEfforts:
              low: low
              high: high
              max: max
        requestImagePixelBudget: 1048576
        requestImageMaxBytes: 786432
        maxRequestImageBytes: 1400000

# Entry-point agents (session titles and similar) default to the same route.
- id: agent-default-model
  config:
    provider: kimi-coding
    model: kimi-for-coding

- id: tool-web
  disabled: false
  config:
    fetch: true
    search: true
    searchTimeoutMs: 60000

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

# workspace-write + never is not a stock preset (stock workspace-write asks).
# Name that pair as the only table entry so permission-presets can boot without
# exposing /permission switches to ask or danger-full-access.
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: workspace-write
        description: Isolated workspace writes without approval prompts.
