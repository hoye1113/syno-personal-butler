# Syno production overlay over the current DSH base/web bundles.
# dsh-base owns the official compaction backend; schedule is an official
# function plugin and is mounted here because it is not a profile bundle.
# Pin official DeepSeek search, re-enable web_search (web-app disables tool-web),
# mount the Host Tool Bridge, and keep the sandbox on DSH_CWD.
# Do not add dsh-plugin.org marketplace packages here.

- insert:
    - id: preset-syno
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: syno
        name: Syno production
        description: Syno domain agent with the controlled production tool surface.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              watch: false
              customSkillDirs:
                - !!js process.env.SYNO_SKILL_ROOT ?? process.cwd()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: syno-tool-bridge
      name: '@syno/dsh-plugin'
      config:
        toolSet: core
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

- id: tool-web
  disabled: false
  config:
    search: true
    searchTimeoutMs: 60000

- id: web
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

# workspace-write + never is not a stock preset (stock workspace-write asks).
# Name that pair as the only table entry so permission-presets can boot without
# exposing /permission switches to ask or danger-full-access.
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: workspace-write
        description: Isolated workspace writes without approval prompts.
