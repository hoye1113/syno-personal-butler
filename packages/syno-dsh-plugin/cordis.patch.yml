# Syno production overlay over the current DSH base/web bundles.
# dsh-base owns the official compaction backend; schedule is an official
# function plugin and is mounted here because it is not a profile bundle.
# Pin official DeepSeek search, re-enable web_search (web-app disables tool-web),
# mount the Host Tool Bridge, and keep the sandbox on DSH_CWD.
# Do not add dsh-plugin.org marketplace packages here.

- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: syno-tool-bridge
      name: '@syno/dsh-plugin'
      config:
        toolSet: core
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

- id: tool-web
  disabled: false
  config:
    search: true
    searchTimeoutMs: 60000

- id: web
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Syno.'

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

# workspace-write + never is not a stock preset (stock workspace-write asks).
# Name that pair as the only table entry so permission-presets can boot without
# exposing /permission switches to ask or danger-full-access.
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: workspace-write
        description: Isolated workspace writes without approval prompts.
