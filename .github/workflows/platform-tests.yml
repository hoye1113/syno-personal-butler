name: Windows and Mac compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Verify native runtime
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run harness:setup
      - run: pnpm test
        env:
          SYNO_KNOWLEDGE_ROOT: ""
          SYNO_LOCAL_DATA: .local-data
      - run: pnpm run verify
      - run: git diff --check
